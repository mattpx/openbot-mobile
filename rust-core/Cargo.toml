[package]
name = "openbot-core"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["lib", "cdylib"]
name = "openbot_core"

[features]
default = []
uniffi-bindings = ["dep:uniffi"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
jni = { version = "0.21", default-features = false }
uniffi = { version = "0.28", default-features = false, optional = true }
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"
